services:
  - type: web
    name: nexus-shopping-intelligence
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GEMINI_API_KEY
        sync: false
      - key: DEFAULT_GEMINI_MODEL
        value: gemini-3.8-flash
    healthCheckPath: /api/health
    autoDeploy: true
